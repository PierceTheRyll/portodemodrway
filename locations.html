<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f4a2f">
<link rel="icon" href="assets/logo.png">
<title>Clinic Locations – DokterWay Kemang, Bintaro, Bekasi</title>
<meta name="description" content="Find a DokterWay clinic: Kemang (Jakarta Selatan), Bintaro (Tangerang) and Bekasi.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="locations">
<header id="site-header"></header>
<main>
<section class="page-hero">
  <div class="container">
    <nav aria-label="Breadcrumb"><ol class="breadcrumbs"><li><a href="index.html">Home</a></li><li aria-current="page">Clinic Locations</li></ol></nav>
    <h1>Find your nearest clinic</h1>
    <p>Three DokterWay clinics across Jabodetabek. Free consultation at every location.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="form-card" style="margin-bottom:1.6rem">
      <label for="loc-q">Search by area, street or landmark
        <input id="loc-q" type="search" placeholder="e.g. Kemang, Summarecon, Graha Raya…" autocomplete="off">
      </label>
      <div class="chips" id="loc-chips" aria-label="Filter by area"></div>
      <span class="hint" id="loc-count" aria-live="polite"></span>
    </div>
    <div class="loc-layout">
      <div class="loc-list" id="loc-list"></div>
      <iframe id="loc-map" class="map" title="Clinic map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="cta-band" style="margin-top:3rem">
      <div><h2>Need help choosing?</h2><p>Call or WhatsApp for a free consultation: 081549644948 / 083160911633</p></div>
      <a class="btn" href="contact.html">Contact us</a>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="app.js"></script>
</body>
</html>
