<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f4a2f">
<link rel="icon" href="assets/logo.png">
<title>Ratings &amp; Reviews – DokterWay Clinic</title>
<meta name="description" content="Read and share ratings and reviews for DokterWay clinic.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="reviews">
<header id="site-header"></header>
<main>
<section class="page-hero">
  <div class="container">
    <nav aria-label="Breadcrumb"><ol class="breadcrumbs"><li><a href="index.html">Home</a></li><li aria-current="page">Ratings &amp; Reviews</li></ol></nav>
    <h1>Ratings &amp; reviews</h1>
    <p>Honest feedback from DokterWay clients.</p>
  </div>
</section>
<section class="section">
  <div class="container grid" style="grid-template-columns:.8fr 1.2fr;align-items:start" id="rev-grid">
    <div class="grid">
      <div class="card">
        <div class="summary">
          <div class="center"><div class="big-score" id="avg">–</div><div class="stars" id="avg-stars"></div><small id="avg-count" class="hint"></small></div>
          <div id="bars"></div>
        </div>
      </div>
      <div class="form-card">
        <h3>Write a review</h3>
        <div id="rev-gate" class="notice" hidden>Please <a href="login.html?next=reviews.html">sign in</a> or <a href="login.html?tab=signup&next=reviews.html">create an account</a> to post a review.</div>
        <form id="rev-form">
          <div><div style="font-size:.85rem;font-weight:600;margin-bottom:.2rem">Your rating</div><div class="star-input" id="star-input"></div></div>
          <div class="row">
            <label>Clinic<select name="clinic" required></select></label>
            <label>Treatment<select name="treatment"></select></label>
          </div>
          <label>Your comment<textarea name="comment" required maxlength="800" placeholder="Share your experience…"></textarea></label>
          <div class="msg" role="alert"></div>
          <button class="btn" type="submit">Submit review</button>
        </form>
      </div>
    </div>
    <div>
      <div class="row" style="margin-bottom:1rem">
        <label>Clinic<select id="rv-clinic"></select></label>
        <label>Sort by<select id="rv-sort"><option value="new">Newest</option><option value="high">Highest rating</option><option value="low">Lowest rating</option></select></label>
      </div>
      <div class="grid" id="rev-list"></div>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<style>@media(max-width:960px){#rev-grid{grid-template-columns:1fr!important}}</style>
<script src="app.js"></script>
</body>
</html>
